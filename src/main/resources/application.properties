quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=thebes
quarkus.datasource.password=thebes
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.elasticsearch.hosts=http://localhost:9200

# CORS filter. Quarkus 3 requires the explicit `.enabled` key; the bare
# `quarkus.http.cors` form is no longer recognised.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:3000

# Structured JSON console logging (Quarkus 3 renamed `.json` to `.json.enabled`).
quarkus.log.console.json.enabled=true

# OpenTelemetry: the quarkus-opentelemetry extension is on the classpath, but this
# platform's quarkus-bom manages no OTel *exporter* extension (neither -otlp nor
# -logging), so there is nothing for a tracer to export to and enabling it fails at
# startup. Kept off until an exporter extension is available.
quarkus.otel.enabled=false

# The observability Dev Service launches a Grafana/OTel LGTM container in dev mode.
# Nothing depends on it here, so disable all observability Dev Services.
quarkus.observability.enabled=false

%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.datasource.username=thebes
%test.quarkus.datasource.password=thebes
%test.quarkus.hibernate-orm.schema-management.strategy=none
%test.quarkus.flyway.clean-at-start=true
%test.quarkus.log.console.json.enabled=false
