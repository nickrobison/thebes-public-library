quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=thebes
quarkus.datasource.password=thebes
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/thebes
quarkus.elasticsearch.hosts=http://localhost:9200
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3000
quarkus.log.console.json=true
quarkus.opentelemetry.enabled=true
quarkus.opentelemetry.exporter.otlp.endpoint=http://localhost:4317

%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.database.generation=drop-and-create
